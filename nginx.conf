server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # woff2 уже сжат — повторно не трогаем

    # service worker: всегда свежий, иначе обновления не доедут
    location = /sw.js {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # оболочка: перепроверять на каждом заходе
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # неизменяемые ресурсы
    location ~* ^/(fonts|icons)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
